  - name:
      en: SystemTime
      zh_CN: 系统参数(时间)
    endian: big
    start: 42768
    alias: system_time
    methods:
      read:
        code: 0x03
      write:
        code: 0x10
    properties:
      - index: 0
        type: uint16
        name:
          en: SystemClock:Year
          zh_CN: SystemClock:Year
        precision: 1
        alias: year
        unit: Year
        range:
          enable: true
          lo: 2000
          hi: 2099

      - index: 2
        type: uint16
        alias: month
        name:
          en: SystemClock:Month
          zh_CN: SystemClock:Month
        precision: 1
        unit: Month
        range:
          enable: true
          lo: 1
          hi: 12

      - index: 4
        type: uint16
        alias: day
        name:
          en: SystemClock:Day
          zh_CN: SystemClock:Day
        precision: 1
        unit: Day
        range:
          enable: true
          lo: 1
          hi: 31

      - index: 6
        type: uint16
        alias: hour
        name:
          en: SystemClock:Hour
          zh_CN: SystemClock:Hour
        precision: 1
        unit: Hour
        range:
          enable: true
          lo: 0
          hi: 23

      - index: 8
        type: uint16
        alias: minute
        name:
          en: SystemClock:Minute
          zh_CN: SystemClock:Minute
        precision: 1
        unit: Minute
        range:
          enable: true
          lo: 0
          hi: 59

      - index: 10
        type: uint16
        alias: second
        name:
          en: SystemClock:Second
          zh_CN: SystemClock:Second
        precision: 1
        unit: Second
        range:
          enable: true
          lo: 0
          hi: 59

  - name:
      en: Country
      zh_CN: 系统参数(国家)
    endian: big
    start: 42774
    alias: grid_code
    methods:
      read:
        code: 0x03
      write:
        code: 0x10
    properties:
      - index: 0
        type: uint16
        alias: ""
        name:
          en: Boot/Shutdown
          zh_CN: Boot/Shutdown
        precision: 1
        unit: ""
        range:
          enable: false
          lo: 0
          hi: 1
        enum:
          Shutdown: 0xCE
          Boot: 0xCF
      - index: 2
        type: uint16
        name:
          en: Country/Region
          zh_CN: Country/Region
        precision: 1
        alias: safety
        unit: ""
        range:
          enable: false
          lo: 0
          hi: 1
        enum:
          G99_UK: 0x03
          USA: 0x35
          Hawaii: 0x36
          CQC_CN: 0x37
          Puerto Rico: 0x47
          USA-208: 0x4A
          PR-LUMA: 0x4E

