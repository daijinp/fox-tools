  - name:
      en: WorkMode
      zh_CN: 能量管理（工作模式设置）
    endian: big
    alias: operation_mode
    start: 43252
    methods:
      read:
        code: 0x03
      write:
        code: 0x06
    properties:
      - index: 0
        type: uint16
        alias: work_mode
        name:
          en: Work Mode
          zh_CN: Work Mode
        precision: 1
        unit: ""
        range:
          enable: false
          lo: 0
          hi: 1
        enum:
          SelfUse: 0x0B
          Feedin: 0x0C
          Backup: 0x0D
          PeakShaving: 0x0E

